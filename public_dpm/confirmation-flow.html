
<!doctype html>
<html lang="en-us">

<head>
  <title>Dynamic Stripe Payment: confirmation flow</title>
  <script src="https://js.stripe.com/v3/">
</script>
  <link rel="stylesheet" href="./style.css">
  </link>
</head>

<body>
  <nav class="menu">
    <a href="/" >Dynamic PM</a>
    <a href="/custom-config.html">DPM setup mode </a>
    <a href="/static.html">Static PM</a>
    <a href="/confirmation-flow.html" class="selected">Confirmation flow</a>
  </nav>
  <h3> Adding custome payment limit of </h3>
  <div> klarna: $100 - $10,000</div>
  <div> affirm: $150 - $30,000</div>
  <h2>Dynamic Payment Methods</h2>
  <div id="loading">Loading payment form...</div>
  <form id="payment-form">
    <div>
         <label>Amount: $</label>
      <input type="number" id="amount" value="50.00" step="0.01" min="0.50" />
    </div>
    <div id="payment-element">
      <!-- Stripe Elements will automatically show relevant payment methods -->
    </div>
    <button id="submit-button" type="submit">Pay Now</button>
    <div id="error-message"></div>
  </form>
  <script>
// Initialize Stripe
let stripe;
let elements;
let paymentElement;
let amount;
let currentPaymentType;
document.getElementById("amount").addEventListener("change", initializePayment);
document
  .getElementById("payment-form")
  .addEventListener("submit", handleSubmit);

// Initialize everything when page loads
initApp();

async function initApp() {
  try {
    // Get publishable key from server
    const configResponse = await fetch("/config");
    const { publishableKey, pmc } = await configResponse.json();

    // Initialize Stripe with the key
    stripe = Stripe(publishableKey);

    // Hide loading, show form
    document.getElementById("loading").style.display = "none";
    document.getElementById("payment-form").style.display = "block";

    // Set up event listeners
    document
      .getElementById("amount")
      .addEventListener("change", initializePayment);
    document
      .getElementById("payment-form")
      .addEventListener("submit", handleSubmit);

    // Initialize payment
    await initializePayment();
  } catch (error) {
    document.getElementById("loading").textContent =
      "Error loading payment form: " + error.message;
  }
}
function getAllowedMethods(amount, prds = [], amountRules = {}) {
  return prds.filter((pm) => {
    if (!checkAmountConstraints(amount, pm, amountRules)) return false;
    return true;
  });
}

function checkAmountConstraints(amount, method, amountRules) {
  const rules = amountRules[method];
  if (!rules) return true; // No rules means allowed
  if (rules.min && amount < rules.min) return false;
  if (rules.max && amount > rules.max) return false;
  return true;
}
let allowedMethods = [];
async function initializePayment() {
  amount = Math.round(
    parseFloat(document.getElementById("amount").value) * 100,
  );
  const productResponse = await fetch("/products");
  const { products, amountRangeRule } = await productResponse.json();
  // Get filtered payment methods
  allowedMethods = getAllowedMethods(amount, products, amountRangeRule);
  // Create Payment Intent on server
  // const response = await fetch("/create-payment-intent", {
  //   method: "POST",
  //   headers: {
  //     "Content-Type": "application/json",
  //   },
  //   body: JSON.stringify({ amount, products: allowedMethods }),
  // });
  // const { clientSecret } = await response.json();
  // Create Elements instance - simpler configuration for dynamic methods
  elements = stripe.elements({
    // clientSecret,
    mode: "payment",
    amount,
    currency: "usd",
    payment_method_types: allowedMethods,
    // payment_method_configuration: 'pmc_1Re81oCyF4JkPXbX8hSrtkII',
    appearance: {
      theme: "stripe",
      variables: {
        colorPrimary: "#0570de",
      },
    },
  });

  // Create and mount Payment Element
  if (paymentElement) {
    paymentElement.unmount();
  }

  // Dynamic payment element - Stripe automatically shows relevant methods
  paymentElement = elements.create("payment");
  paymentElement.on("change", (event) => {
    const newPaymentType = event.value?.type;

    // if (newPaymentType !== currentPaymentType) {
    currentPaymentType = newPaymentType;

    // Update fields based on payment method
    paymentElement.update({
      fields: {
        billingDetails: getFieldsForPaymentType(newPaymentType),
      },
    });
    // }
  });

  function getFieldsForPaymentType(type) {
    switch (type) {
      case "us_bank_account":
        return {
          name: "never",
          email: "never",
          address: "never", // Hide address for bank accounts
        };
      case "card":
        return {
          name: "auto",
          email: "auto",
          address: "never", // Show address for cards
        };
      default:
        return {
          name: "auto",
          email: "auto",
          address: "never",
        };
    }
  }
  paymentElement.mount("#payment-element");
}

async function handleSubmit(event) {
  event.preventDefault();

  try {
    elements.submit();
    const { confirmationToken } = await stripe.createConfirmationToken({
      elements,
      params: {
        payment_method_data: {
          // type: currentPaymentType,
          billing_details: {
            name: "dhiraj basukala",
            email: "dhiraj@rapidpaylegal.com",
            address: {
              line1: "123 William Street",
              line2: "",
              city: "New York",
              state: "New York",
              country: "US",
              postal_code: "10038",
            },
          },
        },
        return_url: window.location.origin + "/success.html",
      },
    });
    console.log(confirmationToken);

    const response = await fetch("/process-payment", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        confirmation_token: confirmationToken.id,
        amount,
        payment_method_types: allowedMethods,
      }),
    });
    console.log(response);
    window.location = "/success.html";
  } catch (error) {
    document.getElementById("error-message").textContent = error.message;
    submitButton.disabled = false;
    submitButton.textContent = "Pay Now";
  }
}
  </script>
</body>

</html>
