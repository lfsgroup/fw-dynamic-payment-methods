
<!doctype html>
<html lang="en-us">

<head>
  <title>Dynamic Stripe Payment: confirmation flow</title>
  <script src="https://js.stripe.com/v3/">
</script>
  <link rel="stylesheet" href="./style.css">
  </link>
</head>

<body>
  <nav class="menu">
    <a href="/">Dynamic PM</a>
    <a href="/static.html">Static PM</a>
    <a href="/confirmation-flow.html" class="selected">Confirmation flow</a>
  </nav>
  <h3> Adding custome payment limit of </h3>
  <div> klarna: $100 - $10,000</div>
  <div> affirm: $150 - $30,000</div>
  <h2>Dynamic Payment Methods- confirmation flow</h2>
  <div id="loading">Loading payment form...</div>
  <form id="payment-form">
    <div>
      <label>Amount: $</label>
      <input type="number" id="amount" value="50.00" step="0.01" min="0.50" />
    </div>
    <div id="payment-element">
      <!-- Stripe Elements will automatically show relevant payment methods -->
    </div>
     <div id="custome-acss-payment-element">
      <!-- Stripe Elements for custome acss payment method -->
    </div>
    <button id="submit-button" type="submit">Pay Now</button>
    <div id="error-message"></div>
  </form>
  <script>
// Initialize Stripe
let stripe;
let elements;
let paymentElement;
let amount;
let currentPaymentType;
let currency = "cad";
// hard coded custome payment method id for use as acss_debit
let customeACSSPaymentMethodID = "cpmt_1RilWzHfPm6bNYXASEZoMObY";
let acssClientSecret = "";
document.getElementById("amount").addEventListener("change", initializePayment);
document
  .getElementById("payment-form")
  .addEventListener("submit", handleSubmit);

// Initialize everything when page loads
initApp();

async function initApp() {
  try {
    // Get publishable key from server
    const configResponse = await fetch("/config");
    const { publishableKey, pmc } = await configResponse.json();

    // Initialize Stripe with the key
    stripe = Stripe(publishableKey);

    // Hide loading, show form
    document.getElementById("loading").style.display = "none";
    document.getElementById("payment-form").style.display = "block";

    // Set up event listeners
    document
      .getElementById("amount")
      .addEventListener("change", initializePayment);
    document
      .getElementById("payment-form")
      .addEventListener("submit", handleSubmit);

    // Initialize payment
    await initializePayment();
  } catch (error) {
    document.getElementById("loading").textContent =
      "Error loading payment form: " + error.message;
  }
}
function getAllowedMethods(amount, prds = [], amountRules = {}) {
  const allowedMethods = prds.filter((pm) => {
    if (!checkAmountConstraints(amount, pm, amountRules)) return false;
    return true;
  });

  const useAutomatic = allowedMethods.length == prds.length

  return {
    useAutomatic,
    allowedMethods
  }
}

function checkAmountConstraints(amount, method, amountRules) {
  const rules = amountRules[method];
  if (!rules) return true; // No rules means allowed
  if (rules.min && amount < rules.min) return false;
  if (rules.max && amount > rules.max) return false;
  return true;
}
let allowedMethods = [];
async function initializePayment() {
  amount = Math.round(
    parseFloat(document.getElementById("amount").value) * 100,
  );
  const productResponse = await fetch("/products");
  const { products, amountRangeRule } = await productResponse.json();
  // Get filtered payment methods
  result = getAllowedMethods(amount, products, amountRangeRule);
  const {useAutomatic, allowedMethods} = result;
  // Create Elements instance - simpler configuration for dynamic methods
  const elementConfig = {
    mode: "payment",
    amount,
    currency,
    appearance: {
      theme: "stripe",
      variables: {
        colorPrimary: "#0570de",
      },
    },
    customPaymentMethods: [
      {
        id: customeACSSPaymentMethodID,
        options: {
          type: "static",
          subtitle: "Optional subtitle",
        },
      },
    ],
  };

  if (useAutomatic) {
    console.log("Using Automatic!!!");
    elementConfig.automaticPaymentMethods = {
      enabled: true
    };
  } else {
    // remove acss debit
    console.log("Using Manual with", allowedMethods);
    const filteredMethods = allowedMethods.filter(method => method !== 'acss_debit');
    elementConfig.paymentMethodTypes = filteredMethods;
  }

  elements = stripe.elements(elementConfig);

  // Create and mount Payment Element
  if (paymentElement) {
    paymentElement.unmount();
  }

  // Dynamic payment element - Stripe automatically shows relevant methods
  paymentElement = elements.create("payment");
  paymentElement.on("change", async (event) => {
    const newPaymentType = event.value?.type;

    // if (newPaymentType !== currentPaymentType) {
    if (currentPaymentType === customeACSSPaymentMethodID) {
      // clear the div
      // reset clientSecret
      console.log("flushing acss widgets");
      document.getElementById("custome-acss-payment-element").innerHTML = "";
    }
    currentPaymentType = newPaymentType;
    if (currentPaymentType === customeACSSPaymentMethodID) {
      // fetch client secret
      const response = await fetch("/create-payment-intent", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({ amount, currency, products: ["acss_debit"] }),
      });

      const { clientSecret } = await response.json();
      acssClientSecret = clientSecret;
      const billingDetails = {
        name: "never",
        email: "never",
        address: "never",
      };

      console.log("billingDetails--------------------", billingDetails);
      const acssElement = stripe.elements({
        clientSecret,
        // appearance: {
        //   theme: "stripe",
        //   variables: {
        //     colorPrimary: "#0570de",
        //   },
        // },
      });
      const acssPaymentElement = acssElement.create("payment", {
        fields: {
          billingDetails,
        },
      });
      acssPaymentElement.mount("#custome-acss-payment-element");
    } else {
      console.log(" other dynbamci method fields updates");
      // Update fields based on payment method
      paymentElement.update({
        fields: {
          billingDetails: getFieldsForPaymentType(newPaymentType),
        },
      });
    }
  });

  function getFieldsForPaymentType(type) {
    switch (type) {
      case "us_bank_account":
        return {
          name: "never",
          email: "never",
          address: "never", // Hide address for bank accounts
        };
      case "card":
        return {
          name: "auto",
          email: "auto",
          address: "never", // Show address for cards
        };
      default:
        return {
          name: "auto",
          email: "auto",
          address: "never",
        };
    }
  }
  paymentElement.mount("#payment-element");
}

async function handleSubmit(event) {
  event.preventDefault();
  const submitButton = document.getElementById("submit-button");
  submitButton.disabled = true;
  submitButton.textContent = "Processing...";

  const { submitError, selectedPaymentMethod } = await elements.submit();
  if (selectedPaymentMethod === customeACSSPaymentMethodID) {
    const confirmResponse = await stripe.confirmAcssDebitPayment(
      acssClientSecret,
      {
        payment_method: {
          billing_details: {
            name: "dhiraj basukala",
            email: "dhiraj@rapidpaylegal.com",
            address: {
              line1: "33 Times Avenue",
              line2: "",
              city: "Markham",
              state: "Ontario",
              country: "CA",
              postal_code: "L3T 0A3",
            },
          },
        },
        return_url: window.location.origin + "/success.html",
      },
    );
    if (confirmResponse?.error) {
      document.getElementById("error-message").textContent =
        confirmResponse?.error.message;
      submitButton.disabled = false;
      submitButton.textContent = "Pay Now";
    } else {
      window.location = "/success.html";
    }
    return;
  }
  try {
    elements.submit();
    const { confirmationToken } = await stripe.createConfirmationToken({
      elements,
      params: {
        payment_method_data: {
          billing_details: {
            name: "dhiraj basukala",
            email: "dhiraj@rapidpaylegal.com",
            address: {
              line1: "123 William Street",
              line2: "",
              city: "New York",
              state: "New York",
              country: "US",
              postal_code: "10038",
            },
          },
        },
        return_url: window.location.origin + "/success.html",
      },
    });
    console.log(confirmationToken);

    const processPaymentResponse = await fetch("/process-payment", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        confirmation_token: confirmationToken.id,
        amount,
        currency,
        payment_method_types: allowedMethods,
      }),
    });
    const processPaymentResult = await processPaymentResponse.json();
    console.log("Processing payment result: ", processPaymentResult);
    if (processPaymentResult?.payment_intent?.next_action) {
      const nextActionResponse = await stripe.handleNextAction({
        clientSecret: processPaymentResult.client_secret,
      });
      const nextActionResult = await nextActionResponse.json();
      console.log("Next action result: ", nextActionResult);
      window.location = "/success.html";
    } else {
      window.location = "/success.html";
    }
  } catch (error) {
    console.error("Error occured: ", error);
    document.getElementById("error-message").textContent = error.message;
    submitButton.disabled = false;
    submitButton.textContent = "Pay Now";
  }
}
  </script>
</body>

</html>
