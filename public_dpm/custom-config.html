<!doctype html>
<html lang="en-us">
  <head>
    <title>Dynamic Stripe Payment</title>
    <script src="https://js.stripe.com/v3/"></script>
    <link  rel="stylesheet" href="./style.css"></link>
  </head>
  <body>
    <nav class="menu">
      <a href="/">Dynamic PM</a>
      <a href="/custom-config.html" class="selected">DPM setup mode</a>
      <a href="/static.html">Static PM</a>
   </nav>

    <h2>Dynamic Payment Methods with custom configuration</h2>
    <p> Using setup mode insetead of requiring client secret</p>

    <div id="loading">Loading payment form...</div>
    <form id="payment-form">
      <div>
        <label>Amount: $</label>
        <input type="number" id="amount" value="50.00" step="0.01" min="0.50" />
      </div>

      <div id="payment-element">
        <!-- Stripe Elements will automatically show relevant payment methods -->
      </div>

      <button id="submit-button" type="submit">Pay Now</button>

      <div id="error-message"></div>
    </form>

    <script>
      // Initialize Stripe
      let stripe;
      let elements;
      let paymentElement;

      document
        .getElementById("amount")
        .addEventListener("change", initializePayment);
      document
        .getElementById("payment-form")
        .addEventListener("submit", handleSubmit);

      // Initialize everything when page loads
      initApp();

      async function initApp() {
        try {
          // Get publishable key from server
          const configResponse = await fetch("/config");
          const { publishableKey, pmc } = await configResponse.json();

          // Initialize Stripe with the key
          stripe = Stripe(publishableKey);

          // Hide loading, show form
          document.getElementById("loading").style.display = "none";
          document.getElementById("payment-form").style.display = "block";

          // Set up event listeners
          document
            .getElementById("amount")
            .addEventListener("change", initializePayment);
          document
            .getElementById("payment-form")
            .addEventListener("submit", handleSubmit);

          // Initialize payment
          await initializePayment(pmc);
        } catch (error) {
          document.getElementById("loading").textContent =
            "Error loading payment form: " + error.message;
        }
      }

      // Initialize payment when page loads
      // initializePayment();

      async function initializePayment(pmc) {
        const amount = Math.round(
          parseFloat(document.getElementById("amount").value) * 100,
        );

                // Create Elements instance - simpler configuration for dynamic methods
        elements = stripe.elements({
          mode:'setup',
          currency: 'usd',
          payment_method_configuration: pmc,
          // setup_future_usage: 'off_session',
        });

        // Create and mount Payment Element
        if (paymentElement) {
          paymentElement.unmount();
        }

        // Dynamic payment element - Stripe automatically shows relevant methods
        paymentElement = elements.create("payment",{ layout:'tabs'});
        paymentElement.mount("#payment-element");
        paymentElement.on('ready', () => {
            console.log('Payment Element is ready');
        });

        // Optional: Handle change events
        paymentElement.on('change', (event) => {
            if (event.complete) {
                console.log('Payment method is complete');
            }
        });
      }

      async function handleSubmit(event) {
        event.preventDefault();

        const submitButton = document.getElementById("submit-button");
        submitButton.disabled = true;
        submitButton.textContent = "Processing...";

        const { error } = await stripe.confirmPayment({
          elements,
          confirmParams: {
            return_url: window.location.origin + "/success.html",
          },
        });

        if (error) {
          document.getElementById("error-message").textContent = error.message;
          submitButton.disabled = false;
          submitButton.textContent = "Pay Now";
        }
      }
    </script>
  </body>
</html>
